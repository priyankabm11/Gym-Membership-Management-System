name: Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - member2/integration

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_USER: ci_test
      DB_PASSWORD: ci_test
      DB_NAME: gym_membership_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
